<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Interactive Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* Nice gradient background */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        #live2dCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 25px;
            border-radius: 25px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Segoe UI', monospace;
            font-size: 12px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #info h3 {
            margin: 0 0 10px 0;
            color: #00d9ff;
        }

        #info p {
            margin: 5px 0;
            color: #ccc;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Click effect */
        .click-effect {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 217, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: clickRipple 0.6s ease-out forwards;
        }

        @keyframes clickRipple {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <canvas id="live2dCanvas"></canvas>
    
    <div id="info">
        <h3>Live2D Interactive</h3>
        <p>Mouse X: <span id="mouseX">0.00</span></p>
        <p>Mouse Y: <span id="mouseY">0.00</span></p>
        <p>ParamAngleX: <span id="paramX">0.00</span></p>
        <p>ParamAngleY: <span id="paramY">0.00</span></p>
        <p>Clicks: <span id="clickCount">0</span></p>
    </div>
    
    <div id="instructions">
        🖱️ Move mouse to look around • Click to interact
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading Live2D Model...</p>
    </div>

    <!-- Live2D SDK -->
    <script src="live2dcubismcore.min.js"></script>
    <script src="cubismframework.js"></script>
    <script src="cubismmatrix44.js"></script>
    <script src="cubismrenderer.js"></script>
    <script src="cubismrenderer_webgl.js"></script>
    <script src="cubismshadermanager.js"></script>
    <script src="cubism_globals.js"></script>
    <script src="Live2DTransparentRenderer.js"></script>

    <script>
        let renderer = null;
        let clickCount = 0;
        let targetAngleX = 0;
        let targetAngleY = 0;
        let currentAngleX = 0;
        let currentAngleY = 0;

        // Smooth interpolation
        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        window.addEventListener('load', async () => {
            const canvas = document.getElementById('live2dCanvas');
            const loading = document.getElementById('loading');
            
            // UI elements
            const mouseXEl = document.getElementById('mouseX');
            const mouseYEl = document.getElementById('mouseY');
            const paramXEl = document.getElementById('paramX');
            const paramYEl = document.getElementById('paramY');
            const clickCountEl = document.getElementById('clickCount');

            try {
                // Create renderer
                renderer = new Live2DTransparentRenderer(canvas, {
                    scale: 1.2,
                    premultipliedAlpha: true
                });

                // Load model
                const success = await renderer.loadModel('models/Hiyori/Hiyori.model3.json');

                if (success) {
                    loading.style.display = 'none';
                    console.log('[Interactive] ✓ Model loaded');
                    
                    // Start interaction loop
                    startInteractionLoop();
                } else {
                    loading.innerHTML = '<p style="color: #ff4444;">Failed to load model</p>';
                }

            } catch (error) {
                console.error('[Interactive] Error:', error);
                loading.innerHTML = `<p style="color: #ff4444;">Error: ${error.message}</p>`;
            }

            // Mouse tracking
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) * 2 - 1;
                const y = (e.clientY / window.innerHeight) * 2 - 1;
                
                targetAngleX = x;
                targetAngleY = y;
                
                mouseXEl.textContent = x.toFixed(2);
                mouseYEl.textContent = y.toFixed(2);
            });

            // Click interaction
            document.addEventListener('click', (e) => {
                clickCount++;
                clickCountEl.textContent = clickCount;
                
                // Create click effect
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.style.left = e.clientX + 'px';
                effect.style.top = e.clientY + 'px';
                document.body.appendChild(effect);
                
                // Remove effect after animation
                setTimeout(() => effect.remove(), 600);
                
                // Trigger a reaction
                if (renderer) {
                    // Reset eyes briefly
                    renderer.setParameter('ParamEyeLOpen', 0);
                    renderer.setParameter('ParamEyeROpen', 0);
                    
                    // Open eyes after a moment
                    setTimeout(() => {
                        renderer.setParameter('ParamEyeLOpen', 1);
                        renderer.setParameter('ParamEyeROpen', 1);
                    }, 150);
                    
                    // Slight head tilt on click
                    const originalY = targetAngleY;
                    targetAngleY = originalY + 0.3;
                    setTimeout(() => {
                        targetAngleY = originalY;
                    }, 300);
                }
            });

            // Touch support for mobile
            document.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                const x = (touch.clientX / window.innerWidth) * 2 - 1;
                const y = (touch.clientY / window.innerHeight) * 2 - 1;
                
                targetAngleX = x;
                targetAngleY = y;
                
                mouseXEl.textContent = x.toFixed(2);
                mouseYEl.textContent = y.toFixed(2);
            });

            document.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                
                // Create click effect
                const effect = document.createElement('div');
                effect.className = 'click-effect';
                effect.style.left = touch.clientX + 'px';
                effect.style.top = touch.clientY + 'px';
                document.body.appendChild(effect);
                
                setTimeout(() => effect.remove(), 600);
                
                clickCount++;
                clickCountEl.textContent = clickCount;
            });
        });

        // Interaction loop for smooth parameter updates
        function startInteractionLoop() {
            function update() {
                if (!renderer) return;
                
                // Smooth interpolation for natural movement
                currentAngleX = lerp(currentAngleX, targetAngleX, 0.1);
                currentAngleY = lerp(currentAngleY, targetAngleY, 0.1);
                
                // Update parameters
                renderer.setParameter('ParamAngleX', currentAngleX);
                renderer.setParameter('ParamAngleY', currentAngleY);
                
                // Update UI
                document.getElementById('paramX').textContent = currentAngleX.toFixed(2);
                document.getElementById('paramY').textContent = currentAngleY.toFixed(2);
                
                requestAnimationFrame(update);
            }
            
            update();
        }

        // Cleanup
        window.addEventListener('beforeunload', () => {
            if (renderer) {
                renderer.destroy();
            }
        });
    </script>
</body>
</html>
